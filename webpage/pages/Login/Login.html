<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>WebServer</title>
    <link rel="stylesheet" href="/css/global.css" />
    <link rel="stylesheet" href="/components/Footer/styles.module.css" />
    <link rel="stylesheet" href="/components/Navbar/styles.module.css" />
    <link rel="stylesheet" href="/pages/Login/styles.module.css" />
    <link rel="icon" href="/assets/wolfMoonIco.png" type="image/x-icon" />
    <script src="/js/layout.js"></script>
  </head>

  <body>
    <header id="navbar"></header>
    <div class="login-box">
      <h2>Login</h2>
      <form
        id="loginForm"
        method="POST"
        action="/cgi-bin/login.py"
        enctype="multipart/form-data"
      >
        <input type="text" name="username" placeholder="Username" required />
        <input
          type="password"
          name="password"
          placeholder="Password"
          required
        />

        <button type="submit">Log In</button>
      </form>
      <p id="loginStatus" aria-live="polite"></p>
    </div>
    <footer id="footer"></footer>
  </body>
  <script>
    document
      .getElementById("loginForm")
      .addEventListener("submit", async function (event) {
        event.preventDefault();

        const statusEl = document.getElementById("loginStatus");
        statusEl.textContent = "Checking credentials...";

        try {
          const response = await fetch("/cgi-bin/login.py", {
            method: "POST",
            body: new FormData(this),
          });

          const data = await response.json();

          if (data.success) {
            statusEl.textContent = "✅ " + data.message;
            return;
          }

          statusEl.textContent = "❌ " + (data.message || "Login failed");
        } catch (error) {
          statusEl.textContent = "⚠️ Could not complete login request.";
        }
      });
  </script>
</html>
