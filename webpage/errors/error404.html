<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 · Page not found</title>
    <!-- A clean, modern 404 page with subtle interactive touches -->
    <style>
        /* RESET & GLOBAL */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f5f7fc 0%, #eef0f5 100%);
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem;
        }

        /* CARD CONTAINER */
        .error-container {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 3rem;
            box-shadow: 
                0 25px 40px -12px rgba(0, 10, 30, 0.25),
                inset 0 1px 2px rgba(255, 255, 255, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 3rem 2.5rem;
            transition: all 0.2s ease;
        }

        /* 404 NUMBER WITH MODERN TOUCH */
        .error-code {
            font-size: clamp(6rem, 20vw, 11rem);
            font-weight: 700;
            line-height: 1;
            text-align: center;
            letter-spacing: -0.02em;
            background: linear-gradient(130deg, #1e2b4f, #2c3f6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.2rem;
            filter: drop-shadow(0 4px 6px rgba(0, 10, 30, 0.15));
            position: relative;
        }

        /* decorative 404 underline flourish */
        .error-code::after {
            content: '';
            display: block;
            width: 140px;
            height: 4px;
            background: linear-gradient(90deg, transparent, #4a6fa5, #3a5a8c, transparent);
            border-radius: 4px;
            margin: 0.25rem auto 0;
            opacity: 0.5;
        }

        .message {
            text-align: center;
            margin: 1rem 0 2rem 0;
        }

        .message h1 {
            font-size: clamp(1.8rem, 5vw, 2.4rem);
            font-weight: 600;
            color: #1a263b;
            margin-bottom: 0.75rem;
            letter-spacing: -0.01em;
        }

        .message p {
            font-size: 1.2rem;
            color: #3a445b;
            line-height: 1.5;
            max-width: 450px;
            margin: 0 auto;
            font-weight: 400;
            background: rgba(255,255,255,0.5);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            box-shadow: inset 0 1px 4px rgba(0,0,0,0.02);
        }

        /* ILLUSTRATION / BROKEN LINK ICON (SVG) */
        .illustration {
            display: flex;
            justify-content: center;
            margin: 2rem 0 2.2rem 0;
        }

        .compass-svg {
            width: 120px;
            height: 120px;
            color: #2b3b5c;
            opacity: 0.8;
            filter: drop-shadow(0 8px 12px rgba(21, 40, 68, 0.15));
            transition: transform 0.25s ease;
        }

        .compass-svg:hover {
            transform: rotate(8deg) scale(1.02);
        }

        /* ACTION BUTTONS */
        .actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            margin: 2.2rem 0 0.5rem 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.85rem 2rem;
            border-radius: 60px;
            font-weight: 530;
            font-size: 1.1rem;
            text-decoration: none;
            transition: all 0.2s;
            border: 1px solid rgba(0,0,0,0.04);
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(4px);
            color: #1e2e4a;
            box-shadow: 0 4px 10px rgba(0, 15, 30, 0.08);
            gap: 0.4rem;
        }

        .btn-primary {
            background: #1e2e4a;
            color: white;
            box-shadow: 0 8px 18px -6px #1e2e4a80;
            border: 1px solid #2d3f60;
        }

        .btn-primary:hover {
            background: #263b5e;
            transform: scale(1.02);
            box-shadow: 0 12px 22px -8px #0f1e36;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.98);
            transform: translateY(-3px);
            box-shadow: 0 20px 24px -12px rgba(21, 40, 68, 0.3);
            border-color: rgba(0,0,0,0.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        /* HOME ICON & ARROW */
        .btn-icon {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        /* SMALL HELPER LINKS */
        .footer-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.8rem;
            margin-top: 2.5rem;
            font-size: 0.95rem;
            color: #4a5572;
        }

        .footer-links a {
            color: #2c3e5c;
            text-decoration: none;
            border-bottom: 1px dotted #a0b3cf;
            transition: border 0.2s, color 0.2s;
        }

        .footer-links a:hover {
            color: #0a1a2e;
            border-bottom: 1px solid #1e2e4a;
        }

        /* EXTRA HINTS (LIKE path requested — but just design) */
        .request-hint {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 1.8rem;
            color: #55657e;
            background: rgba(255,255,255,0.7);
            padding: 0.5rem 1.2rem;
            border-radius: 40px;
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
            width: auto;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255,255,255,0.9);
        }

        .request-hint span {
            font-family: 'SF Mono', 'Fira Code', monospace;
            background: #1e2e4a10;
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
            color: #203354;
            font-weight: 500;
        }

        /* RESPONSIVE TWEAKS */
        @media (max-width: 500px) {
            .error-container {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            .actions {
                flex-direction: column;
                width: 100%;
            }
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="error-container">
        <!-- main 404 display -->
        <div class="error-code">404</div>

        <div class="message">
            <h1>Lost in the void?</h1>
            <p>The page you're looking for doesn't exist or has moved.</p>
        </div>

        <!-- simple SVG illustration: broken compass / empty map -->
        <div class="illustration" aria-hidden="true">
            <svg class="compass-svg" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="3 3"/>
                <path d="M12 3L12 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M12 19L12 21" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M5 5L7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M17 17L19 19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M5 19L7 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <path d="M17 7L19 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <circle cx="12" cy="12" r="2.5" stroke="currentColor" stroke-width="1.2"/>
                <path d="M12 12L15 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                <!-- small north mark, slightly broken / askew to fit "404" mood -->
                <path d="M9.5 9.5L12 12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
            </svg>
        </div>

        <!-- CTA buttons: home & go back (real functionality) -->
        <div class="actions">
            <a href="/" class="btn btn-primary">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 9.5L12 3L21 9.5V20C21 20.5 20.5 21 20 21H4C3.5 21 3 20.5 3 20V9.5Z" stroke="currentColor" fill="none"/>
                    <path d="M9 21V13H15V21" stroke="currentColor" fill="none"/>
                </svg>
                Back to home
            </a>
            <a href="javascript:history.back()" class="btn btn-secondary">
                <svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 12L20 12" stroke="currentColor"/>
                    <path d="M10 18L4 12L10 6" stroke="currentColor" fill="none"/>
                </svg>
                Go back
            </a>
        </div>

        <!-- small fake "requested path" for realism / fun (no real js, just design) -->
        <div class="request-hint">
            ⚡ <span>/lost-something?ref=void</span> · not found
        </div>

        <!-- footer help links (safe navigation) -->
        <div class="footer-links">
            <a href="/">Home</a>
            <a href="/contact">Contact</a>
            <a href="/search">Search</a>
            <a href="/sitemap">Sitemap</a>
        </div>
    </div>

    <!-- tiny extra: if you want to simulate a 404 server page, it's static html – perfect for any host -->
    <!--
        This is a self-contained 404 error page.
        Just save it as "404.html" or configure your server to serve it on 404.
        All styles are inline, no external requests – fast and private.
    -->
</body>
</html>
