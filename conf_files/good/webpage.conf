# Configuration file for Webserver
server {
    host 127.0.0.1;
    port 8005;
    
    # Default server for this host:port
    server_name localhost;

    # Default error pages
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    # Max client body size (e.g., for uploads)
    client_max_body_size 100M;

    location / {
        methods GET POST DELETE;
        root ./webpage;
        index pages/Home/Home.html;
        autoindex off;
		auth_login_page /testing/mama;
    }

    location /dashboard {
        methods GET;
        root ./webpage/pages/Dashboard;
        index Dashboard.html;
        autoindex off;
    }

    location /session {
        methods GET;
        root ./webpage/pages/Session;
        index SessionCheck.html;
        autoindex off;
    }

    location /upload-page {
        methods GET;
        root ./webpage/pages/Services;
        index Services.html;
        autoindex off;
    }

    location /login {
        methods GET;
        root ./webpage/pages/Login;
        index Login.html;
        autoindex off;
    }

    location /upload {
        methods POST;
        root ./webpage/uploads;
        upload_enable on;
        upload_store ./webpage/uploads;
    }

    location /cgi-bin {
        methods GET POST;
        root ./webpage/cgi-bin/;
        cgi_extension .*;
        cgi_path /usr/bin/python3;
    }

    location /redirect-me {
        redirect http://example.com;
    }
}


