# Configuration file for Webserv

server {
    host 127.0.0.1;
    port 8001;
    server_name localhost;

    client_max_body_size 10M;

    # /
    location / {
        methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
    }

    # # /put_test/*
    # location /put_test/ {
    #     methods PUT;
    #     root ./YoupiBanane;
    #     upload_store ./YoupiBanane/put_test;
    # }

    # CGI for .bla
    location ~ \.bla$ {
        methods POST;
        cgi_pass ./cgi_test;
    }

    # /post_body
    location /post_body {
        methods POST;
        client_max_body_size 100;
    }

    # /directory/
    location /directory/ {
        methods GET;
        root ./YoupiBanane;
        index youpi.bad_extension;
    }
}
