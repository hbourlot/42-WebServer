# Configuration file for Webserv

server {
    host 127.0.0.1;
    port 8001;

    # Default server for this host:port
    server_name script;

    client_body_temp_path ./tmp;

    client_max_body_size 1M;

    # Default error pages
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # Max client body size (e.g., for uploads)
    client_max_body_size 140000000;

    location / {
        methods GET;
        root ./YoupiBanane;
        index ./youpi.bad_extension;
        autoindex off;
    }

    location /post_body {
        methods POST;
        client_max_body_size 100;
    }

    location /directory {
        methods GET;
        root ./YoupiBanane;
        index ./youpi.bad_extension;
    }

    location *.bla {
        methods POST;
        cgi_pass ./webpage/cgi-bin/ubuntu_cgi_tester;
    }

}

server {
    host 127.0.0.1;
    port 8003;

    # Default server for this host:port
    server_name localhost;

    # Default error pages
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    keepalive_timeout 65;

    # Max client body size (e.g., for uploads)
    client_max_body_size 100M;

    location / {
        methods GET POST DELETE;
        root ./webpage;
        index pages/Home/Home.html;
        autoindex off;
    }

    location /dashboard {
        methods GET;
        root ./webpage/pages/Dashboard;
        index Dashboard.html;
        autoindex off;
    }

    location /services {
        methods GET;
        root ./webpage/pages/Services;
        index Services.html;
        autoindex off;
    }

    location /login {
        methods GET;
        root ./webpage/pages/Login;
        index Login.html;
        autoindex off;
    }

    location /upload 	{
        methods POST;
        root ./webpage/uploads;
        upload_enable on;
        upload_store ./webpage/uploads;
    }

	location /uploads {
		methods GET;
		root ./webpage/uploads;
		autoindex on;
	}

    location /cgi-bin {
        methods GET POST;
        root ./webpage/cgi-bin/;
        cgi_extension .*;
        cgi_path /usr/bin/python3;
    }

    location /redirect-me {
        redirect http://example.com;
    }
}
