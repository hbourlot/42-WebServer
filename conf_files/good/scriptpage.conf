# Configuration file for Webserv

server {
    host 127.0.0.1;
    port 8001;

    # keepalive_timeout 10;

    # Default server for this host:port
    server_name script;

    client_body_temp_path /home/joralves/sgoinfre;

    # Default error pages
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;

    # Max client body size (e.g., for uploads)
    client_max_body_size 140000000;

    location / {
        methods GET;
        root ./YoupiBanane;
        index ./youpi.bad_extension;
        autoindex off;
    }

    location /post_body {
        methods POST;
        client_max_body_size 100;
    }

    location /directory {
        methods GET;
        root ./YoupiBanane;
        index ./youpi.bad_extension;
    }

    location *.bla {
        methods POST;
        cgi_pass ./webpage/cgi-bin/ubuntu_cgi_tester;
    }

}

server {
    host 127.0.0.5;
    port 8005;
    
    # Default server for this host:port
    server_name localhost;

    # Default error pages
    error_page 404 /errors/404.html;
    error_page 500 /errors/500.html;
    # Max client body size (e.g., for uploads)
    client_max_body_size 6000M;

    # client_body_temp_path /home/hbourlot/sgoinfre;
    client_body_temp_path ./tmp;


    location / {
        methods GET POST DELETE;
        root ./webpage;
        index pages/Home/Home.html;
        autoindex off;
    }

    location /dashboard {
        methods GET;
        root ./webpage/pages/Dashboard;
        index Dashboard.html;
        autoindex off;
    }

    location /session {
        methods GET;
        root ./webpage/pages/Session;
        index SessionCheck.html;
        autoindex off;
    }

    location /upload-page {
        methods GET;
        root ./webpage/pages/Services;
        index Services.html;
        autoindex off;
    }

    location /login {
        methods GET;
        root ./webpage/pages/Login;
        index Login.html;
        autoindex off;
    }

    location /upload {
        methods POST;
        root ./webpage/uploads;
        upload_enable on;
        upload_store ./webpage/uploads;
    }

    location /cgi-bin {
        methods GET POST;
        root ./webpage/cgi-bin/;
        cgi_extension .*;
        cgi_path /usr/bin/python3;
    }

	location /upload-list {
		methods GET;
		root ./webpage/pages/UploadList;
		index UploadList.html;
        auth required;
        auth_login_page /login;
		autoindex on;
	}

	location /upload-assets {
		methods GET DELETE;
		root ./webpage/uploads;
		autoindex on;
	}

    location /redirect-me {
        redirect http://example.com;
    }
}

